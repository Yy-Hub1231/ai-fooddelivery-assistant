# 项目全部配置：端口、大模型密钥、数据库、MyBatisPlus
# 应用服务 WEB 访问端口
server.port=9091

# spring ai 配置
spring.ai.dashscope.api-key=你的dashscope密钥
spring.ai.dashscope.chat.options.model=qwen3.7-flash-2026-07-15
spring.ai.dashscope.chat.options.multi-model=true

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost/fooddelivery_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=你的mysql密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis-plus 的配置
mybatis-plus.type-aliases-package=com.student.fooddelivery.entity
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# 配置 ChatMemory 持久化
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:files/init-chat.sql